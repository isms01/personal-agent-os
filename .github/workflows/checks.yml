name: checks

on:
    push:
        branches: [main]
    pull_request:

jobs:
    lint-and-type:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install tools
              run: pip install ruff mypy

            - name: ruff (lint)
              run: ruff check .

            - name: ruff (format check)
              run: ruff format --check .

            - name: mypy (strict)
              run: mypy .
